name: CI - Tests and Linting

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run type-check

      - name: Run unit tests
        run: npm test

      - name: Run coverage
        run: npm run test:coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ./frontend/coverage/coverage-final.json
          flags: frontend
          fail_ci_if_error: false

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run type-check

      - name: Run unit tests
        run: npm test

      - name: Run coverage
        run: npm run test:coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ./backend/coverage/coverage-final.json
          flags: backend
          fail_ci_if_error: false

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Start services with docker-compose
        run: docker-compose up -d

      - name: Wait for database to be ready
        run: |
          echo "Waiting for PostgreSQL to be healthy..."
          timeout 60 bash -c 'until docker-compose exec -T db pg_isready -U recipeuser; do echo "Waiting..."; sleep 2; done'
          echo "✓ PostgreSQL is ready"

      - name: Wait for backend to be ready
        run: |
          echo "Waiting for backend API to be healthy..."
          timeout 90 bash -c 'until curl -f http://localhost:5000/health 2>/dev/null; do echo "Waiting..."; sleep 2; done'
          echo "✓ Backend API is ready"

      - name: Wait for frontend to be ready
        run: |
          echo "Waiting for frontend to be ready..."
          timeout 90 bash -c 'until curl -f http://localhost:5173 2>/dev/null; do echo "Waiting..."; sleep 2; done'
          echo "✓ Frontend is ready"

      - name: Run database migrations
        run: docker-compose exec -T backend npm run migrate:latest

      - name: Run database seeds (test data)
        run: docker-compose exec -T backend npm run seed:run

      - name: Install Playwright dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test --project="Desktop Chrome"
        env:
          BASE_URL: http://localhost:5173
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Print service logs on failure
        if: failure()
        run: |
          echo "=== Backend Logs ==="
          docker-compose logs backend
          echo "=== Database Logs ==="
          docker-compose logs db
          echo "=== Frontend Logs ==="
          docker-compose logs frontend

      - name: Stop services
        if: always()
        run: docker-compose down -v
